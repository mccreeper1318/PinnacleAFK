name: PinnacleAFK
version: '${version}'
main: com.pinnaclesmp.pinnacleafk.PinnacleAfkPlugin
description: Adds manual or automatic AFK status with configurable displays, movement lock, and delayed protection.
author: PinnacleSMP
api-version: '26.2'
commands:
  afk:
    description: Toggle AFK mode on or off.
    usage: /afk
    permission: pinnacleafk.use
  pafk:
    description: Reload PinnacleAFK or manage online AFK players.
    usage: /pafk <reload|list|status|remove> [player]
permissions:
  pinnacleafk.use:
    description: Allows a player to use /afk.
    default: true
  pinnacleafk.admin:
    description: Allows use of PinnacleAFK reload and management commands.
    default: op
  pinnacleafk.protection:
    description: Allows AFK damage protection when protection.require-permission is enabled.
    default: false
